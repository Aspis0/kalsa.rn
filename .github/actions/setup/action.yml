name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20.x

    - name: Cache dependencies
      id: npm-cache
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          **/node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/package.json') }}

    - name: Install dependencies
      if: steps.npm-cache.outputs.cache-hit != 'true'
      run: |
        npm ci --prefix example
        npm ci
      shell: bash

    # `npm run bootstrap` downloads the Hexagon SDK into ~/.hexagon-sdk and
    # generates the Metal embed assembly; without it build:android-libs exits 1
    # in build-hexagon-htp.sh, and every iOS link fails on undefined
    # _ggml_metallib_* symbols. It was dropped from this step back when
    # bootstrap.sh also rewrote the engine tree with the lm_ symbol prefix, and
    # running it here would have corrupted the checkout. That rewrite is gone,
    # so it belongs here again.
    #
    # It is not side-effect-free, and CI is the only place it should run
    # unattended: scripts/bootstrap.sh:106 runs `npm install` in example/ and
    # :176 runs `npm run pods` on macOS, and BOTH example/package-lock.json and
    # example/ios/Podfile.lock are tracked. On an ephemeral runner that is
    # nothing; on a developer machine it dirties two tracked lockfiles.
    - name: Bootstrap & Build
      run: npm run bootstrap && npm run build
      shell: bash
