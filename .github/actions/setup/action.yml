name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20.x

    - name: Cache dependencies
      id: npm-cache
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          **/node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/package.json') }}

    - name: Install dependencies
      if: steps.npm-cache.outputs.cache-hit != 'true'
      run: |
        npm ci --prefix example
        npm ci
      shell: bash

    # `npm run bootstrap` is what downloads the Hexagon SDK into
    # ~/.hexagon-sdk, and build:android-libs starts with build-hexagon-htp.sh,
    # which exits 1 without it. It was dropped from this step back when
    # bootstrap.sh also rewrote the engine tree with the lm_ symbol prefix and
    # running it here would have corrupted the checkout. It no longer renames
    # anything: it fetches the SDK and generates the gitignored Metal embed
    # assembly, so it is safe again -- and required.
    - name: Bootstrap & Build
      run: npm run bootstrap && npm run build
      shell: bash
