name: CI
on:
  push:
    branches:
      - main
      - kalsa
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vendor:
    # Unconditional on purpose: vendor/ is checked in and must stay valid on
    # every branch, including `kalsa`, where the build jobs below are gated
    # off. No `if:` here, so no gating is inherited or widened -- this job
    # simply always runs, and it is the cheapest one in the file (a checkout
    # and two shell assertions, no node setup).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert the vendored engine tree
        run: |
          ./scripts/assert-kalsa-vendor.sh
          ./scripts/assert-rnllama-sources.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: npm run lint

      - name: Typecheck files
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run ts unit tests
        run: npm test -- --maxWorkers=2 --coverage

      # Red on `kalsa` for one reason now; this commit closes the other. Run
      # 35360547883 died on `cpp/llama-kv-cache-iswa.cpp:97: error:
      # 'runtime_error' is not a member of 'std'` — the file missed <stdexcept>,
      # which clang forgives and GCC does not — and the pin bump in this commit
      # brings kalsallama's fixed copy (src/llama-kv-cache-iswa.cpp:9).
      #
      # What is left is structural and cannot be fixed from inside this repo.
      # tests/CMakeLists.txt:91 puts cpp/rn-llama.cpp in RNLLAMA_COMMON_SOURCES,
      # so every test target compiles it, and cpp/rn-llama.cpp:2 includes
      # "bmoe_stream.h" — a header that lives in the app repo (native/bmoe/rn)
      # by design and is not checked out here. Two TUs are missing besides: that
      # file's globs take llama*.cpp but nothing lists cpp/rn-governor.cpp or
      # cpp/rn-governor-params.cpp, so rn_governor would fail at link even with
      # the header. Un-gating therefore means putting a private sibling repo
      # inside this job — a PAT or deploy key in this repo's secrets — which is
      # Marco's call, not a side effect of a pin bump.
      - name: Run c++ unit tests
        if: github.ref != 'refs/heads/kalsa'
        run: |
          cd tests
          chmod +x build_and_test.sh run_tests.sh
          ./build_and_test.sh
          ./run_tests.sh

  build-ios-from-source:
    # `github.ref` is refs/pull/<n>/merge on a PR, so the ref test alone lets a
    # kalsa -> main PR run these against the kalsallama cpp/ they cannot build.
    if: github.head_ref != 'kalsa' && github.ref != 'refs/heads/kalsa'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache build & pods
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            example/ios/Pods
            example/ios/build
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Upgrade CocoaPods to version 1.15.2
        run: |
          gem uninstall cocoapods --ignore-dependencies
          gem install cocoapods -v 1.15.2

      - name: Install cocoapods
        run: |
          npm run example run pods

      - name: Build example for iOS
        run: |
          npm run build:ios

  build-ios-frameworks:
    # `github.ref` is refs/pull/<n>/merge on a PR, so the ref test alone lets a
    # kalsa -> main PR run these against the kalsallama cpp/ they cannot build.
    if: github.head_ref != 'kalsa' && github.ref != 'refs/heads/kalsa'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache build & pods
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            example/ios/Pods
            example/ios/build
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Upgrade CocoaPods to version 1.15.2
        run: |
          gem uninstall cocoapods --ignore-dependencies
          gem install cocoapods -v 1.15.2

      - name: Install cocoapods
        run: |
          npm run example run pods
        env:
          RNLLAMA_BUILD_FROM_SOURCE: 0

      - name: Build frameworks
        run: |
          npm run build:ios-frameworks

      - name: Build example for iOS
        run: |
          npm run build:ios

  build-android-from-source:
    # `github.ref` is refs/pull/<n>/merge on a PR, so the ref test alone lets a
    # kalsa -> main PR run these against the kalsallama cpp/ they cannot build.
    if: github.head_ref != 'kalsa' && github.ref != 'refs/heads/kalsa'
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Debug objects carry DWARF, so they need more room than the release job's.
      CCACHE_MAXSIZE: 2G
      # The NDK is reinstalled per run, so hash the compiler rather than stat it.
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        run: |
          df -h
          echo "Removing dotnet"
          sudo rm -rf /usr/share/dotnet
          echo "Removing ghc"
          sudo rm -rf /opt/ghc
          echo "Removing hostedtoolcache"
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Gradle cache
        uses: burrunan/gradle-cache-action@v3
        with:
          gradle-version: wrapper

      - name: Cache Hexagon HTP & OpenCL artifacts
        id: htp-cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            bin
            vendor/llama.cpp/ggml/src/ggml-hexagon/htp/v73
          key: ${{ runner.os }}-htp-${{ hashFiles('scripts/build-hexagon-htp.sh', 'scripts/build-opencl.sh', 'scripts/docker-build-wrapper.sh', 'vendor/llama.cpp/ggml/src/ggml-hexagon/htp/**', 'vendor/OpenCL-Headers/**', 'vendor/OpenCL-ICD-Loader/**') }}

      - name: Cache ccache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-android-src-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-android-src-

      - name: Setup ccache
        uses: ./.github/actions/setup-ccache

      - name: Build example for Android
        env:
          HEXAGON_SDK_VERSION: 6.4.0.2
          HEXAGON_TOOLS_VERSION: 19.0.04
          # Each variant recompiles the whole source tree, so build only the ones
          # that exercise distinct code paths: generic CPU, arm64 with
          # dotprod+i8mm+hexagon+opencl, and x86_64. The remaining arm64 variants
          # differ only in -march; build-android-libs still builds all of them.
          ORG_GRADLE_PROJECT_rnllamaVariants: rnllama,rnllama_v8_2_dotprod_i8mm_hexagon_opencl,rnllama_x86_64
          ORG_GRADLE_PROJECT_rnllamaHtpArtifactsUpToDate: ${{ steps.htp-cache.outputs.cache-hit == 'true' }}
        run: |
          export HEXAGON_SDK_ROOT="$HOME/.hexagon-sdk/$HEXAGON_SDK_VERSION"
          export HEXAGON_TOOLS_ROOT="$HEXAGON_SDK_ROOT/tools/HEXAGON_Tools/$HEXAGON_TOOLS_VERSION"
          npm run build:android
          ccache --show-stats

  build-android-libs:
    # `github.ref` is refs/pull/<n>/merge on a PR, so the ref test alone lets a
    # kalsa -> main PR run these against the kalsallama cpp/ they cannot build.
    if: github.head_ref != 'kalsa' && github.ref != 'refs/heads/kalsa'
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        run: |
          df -h
          echo "Removing dotnet"
          sudo rm -rf /usr/share/dotnet
          echo "Removing ghc"
          sudo rm -rf /opt/ghc
          echo "Removing hostedtoolcache"
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Gradle cache
        uses: burrunan/gradle-cache-action@v3
        with:
          gradle-version: wrapper

      - name: Cache ccache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-android-libs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-android-libs-

      - name: Setup ccache
        uses: ./.github/actions/setup-ccache

      - name: Build libraries
        run: |
          npm run build:android-libs
          ccache --show-stats

      # This step exists to prove the prebuilt path works, using the libraries the
      # previous step just built. It has to be -P, not a sed on
      # example/android/gradle.properties: android/gradle.properties force-enables
      # from-source builds for llama.rn, and a subproject's own gradle.properties
      # outranks the root project's. Only the command line beats both.
      - name: Build example for Android
        run: |
          cd example/android
          ./gradlew assembleDebug --stacktrace -PrnllamaBuildFromSource=false
